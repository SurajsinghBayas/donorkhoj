# DonorKhoj — Nginx reverse proxy (TLS termination) for the EC2 backend.
# Prerequisites: a domain (e.g. api.donorkhoj.in) pointing at the instance,
# certbot certificate issued for it. Replace server_name + paths.

# HTTP: redirect + Let's Encrypt challenge
server {
    listen 80;
    server_name api.donorkhoj.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy to gunicorn
server {
    listen 443 ssl;
    server_name api.donorkhoj.in;

    ssl_certificate     /etc/letsencrypt/live/api.donorkhoj.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.donorkhoj.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;   # lab-report PDF uploads

    # Basic rate limiting (tune to taste)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req zone=api burst=60 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (/agents/ws/*)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
